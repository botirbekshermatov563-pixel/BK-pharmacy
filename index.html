    /* 3D Anatomy Model Viewer & Hotspots */
    model-viewer#bodyViewer {
      width: 100%;
      height: 100%;
      background: transparent;
      --poster-color: transparent;
      outline: none;
    }

    .hotspot-3d {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hotspot-3d:hover,
    .hotspot-3d.active {
      transform: translate(-50%, -50%) scale(1.3);
      z-index: 50;
    }

    .hotspot-point {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #059669;
      border: 2.5px solid #ffffff;
      box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.35), 0 4px 12px rgba(4, 120, 87, 0.4);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }

    .hotspot-point::after {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #34d399;
    }

    .hotspot-pulse {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid #10b981;
      animation: pulse-ring 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      pointer-events: none;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.5); opacity: 0.95; }
      80%, 100% { transform: scale(2.2); opacity: 0; }
    }

    .hotspot-tag {
      position: absolute;
      left: calc(100% + 8px);
      top: 50%;
      transform: translateY(-50%) translateX(-4px);
      background: rgba(6, 78, 59, 0.95);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      white-space: nowrap;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
    }

    .hotspot-3d:hover .hotspot-tag,
    .hotspot-3d.active .hotspot-tag {
      opacity: 1;
      visibility: visible;
      transform: translateY(-50%) translateX(0);
    }
  </style>

                {cart.length > 0 && (
                  <div className="pt-4 border-t space-y-3">
                    <div className="flex justify-between font-black text-base text-slate-900">
                      <span>{t('cart_total')}</span>
                      <span>{cartTotal.toLocaleString()} {t('currency')}</span>
                    </div>
                    <button
                      onClick={() => {
                        const name = prompt(lang === 'uz' ? "Ismingizni kiriting:" : "Укажите ваше имя:") || 'Клиент';
                        const phone = prompt(lang === 'uz' ? "Telefon raqamingiz:" : "Укажите номер телефона:") || '+998';
                        const address = prompt(lang === 'uz' ? "Yetkazish manzili:" : "Укажите адрес доставки:") || 'г. Ташкент';
                        handleSendOrder({ name, phone, address });
                      }}
                      className="w-full py-3.5 rounded-2xl bg-emerald-600 text-white font-bold text-sm shadow-md hover:bg-emerald-700"
                    >
                      {t('btn_submit_order')}
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<BKPharmacyApp />);
  </script>
</body>
</html>
